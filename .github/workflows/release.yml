name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # Signed build provenance for every published artifact.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Bootstrap godo
        run: go install github.com/my-rv/godo/cmd/godo@v0.2.0
      - name: Verify tag tests
        run: $(go env GOPATH)/bin/godo ci
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: absent secret → tap/bucket push is skipped, not failed.
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/hensu_*
            dist/checksums.txt
